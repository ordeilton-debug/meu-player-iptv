name: Robô Atualizador IPTV Busca Ampla

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Executar Varredura Ampla
        env:
          JSONBIN_BIN_ID: "${{ secrets.JSONBIN_BIN_ID }}"
          JSONBIN_SECRET_KEY: "${{ secrets.JSONBIN_SECRET_KEY }}"
        run: |
          python -c "
          import requests
          import os

          bin_id = os.environ.get('JSONBIN_BIN_ID')
          secret_key = os.environ.get('JSONBIN_SECRET_KEY')
          
          url = f'https://api.jsonbin.io/v3/b/{bin_id}'
          headers = {
              'X-Master-Key': secret_key,
              'Content-Type': 'application/json'
          }

          print('Iniciando varredura ampla em toda a rede...')
          
          fontes_iptv = [
              'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/br.m3u',
              'https://raw.githubusercontent.com/FunctionError/PPV/main/iptv.m3u'
          ]

          # Termos da sua lista atualizada (sem Canal Brasil e Rede Brasil, com History e expansões)
          termos_desejados = [
              'a&e', 'amc', 'axn', 'cine brasil', 'cinemax', 'comedy central',
              'hbo', 'paramount', 'prime box', 'sony channel', 'sony movies', 'space',
              'studio universal', 'tcm', 'tnt', 'universal tv', 'usa network', 'warner',
              'adult swim', 'bandsports', 'combate', 'espn', 'fishtv', 'fuel tv', 'golf channel',
              'premiere', 'sportv', 'sportynet', 'nsports', 'xsports', 'discovery home',
              'discovery turbo', 'discovery world', 'food network', 'gnt', 'hgtv', 'lifetime',
              'off', 'tlc', 'travel box', 'megapix', 'telecine', 'record', 'bandeirantes',
              'sbt', 'globo', 'cartoon network', 'dreamworks', 'gloob',
              'gulli', 'nickelodeon', 'tooncast', 'history', 'filmes', 'series', 'cinema'
          ]

          termos_proibidos = [
              'igreja', 'assembleia', 'universal', 'evangelica', 'gospel', 'radio', 
              'padre', 'deus', 'ministerio', 'boi', 'agro', 'rural', 'arte', 'cultura',
              'camara', 'senado', 'tjsp', 'justica'
          ]

          canais_encontrados = []

          try:
              for fonte in fontes_iptv:
                  try:
                      resposta = requests.get(fonte, timeout=25)
                      if resposta.status_code == 200:
                          linhas = resposta.text.splitlines()
                          nome_atual = ''
                          for linha in linhas:
                              if linha.startswith('#EXTINF:'):
                                  if ',' in linha:
                                      nome_atual = linha.split(',')[1].strip()
                              elif linha.startswith('http'):
                                  link_canal = linha.strip()
                                  nome_lower = nome_atual.lower()

                                  if any(proibido in nome_lower for proibido in termos_proibidos):
                                      continue

                                  if any(termo in nome_lower for termo in termos_desejados):
                                      canais_encontrados.append({
                                          'nome': nome_atual,
                                          'url': link_canal,
                                          'categoria': 'Geral'
                                      })

                                  # Limite bem alto para trazer bastante opção
                                  if len(canais_encontrados) >= 1500:
                                      break
                  except:
                      pass
                  if len(canais_encontrados) >= 1500:
                      break
              
              if canais_encontrados:
                  payload = {'canais': canais_encontrados}
                  update_resp = requests.put(url, json=payload, headers=headers)
                  if update_resp.status_code == 200:
                      print(f'Sucesso! {len(canais_encontrados)} canais salvos.')
                  else:
                      print(f'Erro ao atualizar JSONBin: {update_resp.text}')
              else:
                  print('Nenhum canal encontrado.')

          except Exception as e:
              print(f'Erro na execucao do robo: {e}')
          "
