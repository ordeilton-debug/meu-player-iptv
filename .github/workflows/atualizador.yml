name: Robô Atualizador IPTV

on:
  schedule:
    - cron: '*/10 * * * *' # Roda a cada 10 minutos
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Executar Varredura Focada
        env:
          JSONBIN_BIN_ID: "${{ secrets.JSONBIN_BIN_ID }}"
          JSONBIN_SECRET_KEY: "${{ secrets.JSONBIN_SECRET_KEY }}"
        run: |
          python -c "
          import requests
          import os

          bin_id = os.environ.get('JSONBIN_BIN_ID')
          secret_key = os.environ.get('JSONBIN_SECRET_KEY')
          
          url = f'https://api.jsonbin.io/v3/b/{bin_id}'
          headers = {
              'X-Master-Key': secret_key,
              'Content-Type': 'application/json'
          }

          print('Iniciando varredura estrita...')
          
          fontes_iptv = [
              'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/br.m3u',
              'https://raw.githubusercontent.com/FunctionError/PPV/main/iptv.m3u'
          ]

          termos_proibidos = ['igreja', 'assembleia', 'universal', 'evangelica', 'gospel', 'radio', 'padre', 'deus', 'ministerio', 'tv diario', 'tv jangadeiro', 'tv cidade', 'tv ceara']

          canais_encontrados = []
          urls_vistas = set()

          try:
              for fonte in fontes_iptv:
                  try:
                      resposta = requests.get(fonte, timeout=15)
                      if resposta.status_code == 200:
                          linhas = resposta.text.splitlines()
                          nome_atual = ''
                          for linha in linhas:
                              if linha.startswith('#EXTINF:'):
                                  if ',' in linha:
                                      nome_atual = linha.split(',')[1].strip()
                              elif linha.startswith('http'):
                                  link_canal = linha.strip()
                                  
                                  if link_canal in urls_vistas:
                                      continue

                                  nome_lower = nome_atual.lower()

                                  # Bloqueia lixo e evangélicos
                                  if any(proibido in nome_lower for proibido in termos_proibidos):
                                      continue

                                  aceitar = False

                                  # Filmes e Séries (foco total em 24h e fechados)
                                  if any(filme in nome_lower for filme in ['filme', 'hbo', 'telecine', 'cinemax', 'paramount', 'megapix', 'warner', 'action', 'comedy', 'classics', 'sky', 'universal', 'studio', 'prime', 'netflix', 'apple', 'disney', 'suspense', 'terror', 'cinema']):
                                      aceitar = True
                                  # Esportes
                                  elif any(esp in nome_lower for esp in ['espn', 'sportv', 'premiere', 'caze', 'combate', 'conmebol', 'bandsports', 'nfl', 'nba', 'futebol', 'esporte', 'fight']):
                                      aceitar = True
                                  # Desenhos e Animes
                                  elif any(desenho in nome_lower for desenho in ['cartoon', 'anime', 'crunchyroll', 'nickelodeon', 'nick', 'toon', 'boomerang', 'disney', 'toons', 'kids']):
                                      aceitar = True

                                  if aceitar:
                                      urls_vistas.add(link_canal)
                                      canais_encontrados.append({
                                          'nome': nome_atual,
                                          'url': link_canal,
                                          'categoria': 'Selecionado'
                                      })

                                  if len(canais_encontrados) >= 400:
                                      break
                  except:
                      pass
                  if len(canais_encontrados) >= 400:
                      break
              
              if canais_encontrados:
                  payload = {'canais': canais_encontrados}
                  update_resp = requests.put(url, json=payload, headers=headers)
                  if update_resp.status_code == 200:
                      print(f'Sucesso! {len(canais_encontrados)} canais salvos.')
                  else:
                      print(f'Erro ao atualizar JSONBin: {update_resp.text}')
              else:
                  print('Nenhum canal encontrado.')

          except Exception as e:
              print(f'Erro na execucao do robo: {e}')
          "
