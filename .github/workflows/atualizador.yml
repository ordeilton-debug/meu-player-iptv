name: Robô Atualizador IPTV Inteligente ID

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Executar Varredura Inteligente
        env:
          JSONBIN_BIN_ID: "${{ secrets.JSONBIN_BIN_ID }}"
          JSONBIN_SECRET_KEY: "${{ secrets.JSONBIN_SECRET_KEY }}"
        run: |
          python -c "
          import requests
          import os

          bin_id = os.environ.get('JSONBIN_BIN_ID')
          secret_key = os.environ.get('JSONBIN_SECRET_KEY')
          
          url = f'https://api.jsonbin.io/v3/b/{bin_id}'
          headers = {
              'X-Master-Key': secret_key,
              'Content-Type': 'application/json'
          }

          print('Iniciando varredura inteligente com injeção garantida do Discovery ID...')
          
          fontes_iptv = [
              'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/br.m3u',
              'https://raw.githubusercontent.com/FunctionError/PPV/main/iptv.m3u'
          ]

          termos_desejados = [
              'investigacaodiscovery', 'investigacao discovery', 'discovery id', 'id channel',
              'tv series', 'series', '24h', 'maratona', 'pluto', 'filmes', 'cinema', 
              'anime', 'animes', 'cartoon', 'retro', 'classics', 'classic', 'axn', 
              'hbo', 'telecine', 'megapix', 'space', 'tnt', 'paramount', 'universal', 
              'warner', 'sony', 'comedy', 'amc', 'cinemax', 'history', 'discovery',
              'gnt', 'tlc', 'lifetime', 'espn', 'sportv', 'premiere', 'combate', 
              'globo', 'sbt', 'record', 'band'
          ]

          termos_proibidos = [
              'igreja', 'assembleia', 'universal', 'evangelica', 'gospel', 'radio', 
              'padre', 'deus', 'ministerio', 'boi', 'agro', 'rural', 'arte', 'cultura',
              'camara', 'senado', 'tjsp', 'justica'
          ]

          canais_encontrados = []

          # Injeção fixa garantida do Discovery ID (baseado no iframe que você achou)
          # Se o link cair, na próxima execução o robô faz varredura para atualizar
          canal_id_fixo = {
              'nome': 'Discovery ID (Investigation Discovery)',
              'url': 'https://redecanaistv.asia/player3/ch.php?canal=investigacaodiscovery',
              'categoria': 'Canais 24h e ID'
          }
          
          # Garante que ele entra em primeiro na lista para você achar fácil
          canais_encontrados.append(canal_id_fixo)

          try:
              for fonte in fontes_iptv:
                  try:
                      resposta = requests.get(fonte, timeout=25)
                      if resposta.status_code == 200:
                          linhas = resposta.text.splitlines()
                          nome_atual = ''
                          for linha in linhas:
                              if linha.startswith('#EXTINF:'):
                                  if ',' in linha:
                                      nome_atual = linha.split(',')[1].strip()
                              elif linha.startswith('http'):
                                  link_canal = linha.strip()
                                  nome_lower = nome_atual.lower().replace(' ', '')

                                  if any(proibido in nome_lower for proibido in termos_proibidos):
                                      continue

                                  if any(termo.replace(' ', '') in nome_lower for termo in termos_desejados):
                                      # Evita duplicar se já adicionou
                                      if not any(c['url'] == link_canal for c in canais_encontrados):
                                          canais_encontrados.append({
                                              'nome': nome_atual,
                                              'url': link_canal,
                                              'categoria': 'Canais 24h e ID'
                                          })

                                  if len(canais_encontrados) >= 1800:
                                      break
                  except:
                      pass
                  if len(canais_encontrados) >= 1800:
                      break
              
              if canais_encontrados:
                  payload = {'canais': canais_encontrados}
                  update_resp = requests.put(url, json=payload, headers=headers)
                  if update_resp.status_code == 200:
                      print(f'Sucesso! {len(canais_encontrados)} canais salvos, incluindo o Discovery ID.')
                  else:
                      print(f'Erro ao atualizar JSONBin: {update_resp.text}')
              else:
                  print('Nenhum canal encontrado.')

          except Exception as e:
              print(f'Erro na execucao do robo: {e}')
          "
