name: Robô Atualizador IPTV Inteligente

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Executar Varredura com Teste de Conexao
        env:
          JSONBIN_BIN_ID: "${{ secrets.JSONBIN_BIN_ID }}"
          JSONBIN_SECRET_KEY: "${{ secrets.JSONBIN_SECRET_KEY }}"
        run: |
          python -c "
          import requests
          import os

          bin_id = os.environ.get('JSONBIN_BIN_ID')
          secret_key = os.environ.get('JSONBIN_SECRET_KEY')
          
          url = f'https://api.jsonbin.io/v3/b/{bin_id}'
          headers = {
              'X-Master-Key': secret_key,
              'Content-Type': 'application/json'
          }

          print('Iniciando varredura com filtro estrito e teste de links...')
          
          fontes_iptv = [
              'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/br.m3u',
              'https://raw.githubusercontent.com/FunctionError/PPV/main/iptv.m3u'
          ]

          # Termos proibidos (lixo, evangélicos, boi, arte, etc.)
          termos_proibidos = [
              'igreja', 'assembleia', 'universal', 'evangelica', 'gospel', 'radio', 'padre', 
              'deus', 'ministerio', 'boi', 'agro', 'rural', 'arte', 'cultura', 'camara', 
              'senado', 'assembleia legislativa', 'tjsp', 'justica', 'parlamentar'
          ]

          canais_encontrados = []
          urls_vistas = set()

          cont_globo = 0
          cont_sbt = 0
          cont_record = 0

          def testar_link(link):
              try:
                  # Teste rápido e leve para verificar se o link responde
                  resp = requests.head(link, timeout=3, allow_redirects=True)
                  if resp.status_code < 400:
                      return True
                  # Se o head falhar, tenta um get parcial rápido
                  resp_get = requests.get(link, timeout=3, stream=True)
                  if resp_get.status_code < 400:
                      return True
              except:
                  pass
              return False

          try:
              for fonte in fontes_iptv:
                  try:
                      resposta = requests.get(fonte, timeout=15)
                      if resposta.status_code == 200:
                          linhas = resposta.text.splitlines()
                          nome_atual = ''
                          for linha in linhas:
                              if linha.startswith('#EXTINF:'):
                                  if ',' in linha:
                                      nome_atual = linha.split(',')[1].strip()
                              elif linha.startswith('http'):
                                  link_canal = linha.strip()
                                  
                                  if link_canal in urls_vistas:
                                      continue

                                  nome_lower = nome_atual.lower()

                                  # Bloqueia lixo indesejado
                                  if any(proibido in nome_lower for proibido in termos_proibidos):
                                      continue

                                  aceitar = False

                                  # 1. Filmes, Séries, Warner, Space, TCM, Documentários e Fechados
                                  if any(termo in nome_lower for termo in ['filme', 'hbo', 'telecine', 'cinemax', 'paramount', 'megapix', 'warner', 'space', 'tcm', 'action', 'comedy', 'classics', 'sky', 'universal', 'studio', 'prime', 'netflix', 'apple', 'disney', 'suspense', 'terror', 'cinema', 'history', 'discovery', 'investigation', 'id', 'natgeo', 'animal planet']):
                                      aceitar = True
                                  # 2. Esportes Famosos
                                  elif any(termo in nome_lower for termo in ['espn', 'sportv', 'premiere', 'caze', 'combate', 'conmebol', 'bandsports', 'nfl', 'nba', 'futebol', 'esporte', 'fight']):
                                      aceitar = True
                                  # 3. Desenhos e Animes
                                  elif any(termo in nome_lower for termo in ['cartoon', 'anime', 'crunchyroll', 'nickelodeon', 'nick', 'toon', 'boomerang', 'toons', 'kids']):
                                      aceitar = True
                                  # 4. Globo (Até 3 opções)
                                  elif 'globo' in nome_lower and cont_globo < 3:
                                      cont_globo += 1
                                      aceitar = True
                                  # 5. SBT (Até 3 opções)
                                  elif 'sbt' in nome_lower and cont_sbt < 3:
                                      cont_sbt += 1
                                      aceitar = True
                                  # 6. Record (Até 2 opções)
                                  elif 'record' in nome_lower and cont_record < 2:
                                      cont_record += 1
                                      aceitar = True

                                  if aceitar:
                                      # Testa se o link está realmente funcionando antes de incluir
                                      print(f'Testando canal: {nome_atual}...')
                                      if testar_link(link_canal):
                                          urls_vistas.add(link_canal)
                                          canais_encontrados.append({
                                              'nome': nome_atual,
                                              'url': link_canal,
                                              'categoria': 'Validado'
                                          })
                                          print(f'-> APROVADO: {nome_atual}')
                                      else:
                                          print(f'-> FORA DO AR: {nome_atual}')

                                  if len(canais_encontrados) >= 150:
                                      break
                  except:
                      pass
                  if len(canais_encontrados) >= 150:
                      break
              
              if canais_encontrados:
                  payload = {'canais': canais_encontrados}
                  update_resp = requests.put(url, json=payload, headers=headers)
                  if update_resp.status_code == 200:
                      print(f'Sucesso! {len(canais_encontrados)} canais funcionais salvos.')
                  else:
                      print(f'Erro ao atualizar JSONBin: {update_resp.text}')
              else:
                  print('Nenhum canal valido encontrado.')

          except Exception as e:
              print(f'Erro na execucao do robo: {e}')
          "
