name: Robô Atualizador IPTV

on:
  schedule:
    - cron: '*/10 * * * *' # Roda a cada 10 minutos
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Executar Varredura e Atualizacao Inteligente
        env:
          JSONBIN_BIN_ID: "${{ secrets.JSONBIN_BIN_ID }}"
          JSONBIN_SECRET_KEY: "${{ secrets.JSONBIN_SECRET_KEY }}"
        run: |
          python -c "
          import requests
          import os

          bin_id = os.environ.get('JSONBIN_BIN_ID')
          secret_key = os.environ.get('JSONBIN_SECRET_KEY')
          
          url = f'https://api.jsonbin.io/v3/b/{bin_id}'
          headers = {
              'X-Master-Key': secret_key,
              'Content-Type': 'application/json'
          }

          print('Iniciando varredura filtrada e limpa...')
          
          fontes_iptv = [
              'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/br.m3u',
              'https://raw.githubusercontent.com/FunctionError/PPV/main/iptv.m3u'
          ]

          # Termos indesejados para bloquear de vez (evangélicos, rádio, lixo)
          termos_proibidos = ['igreja', 'assembleia', 'universal', 'evangelica', 'gospel', 'radio', 'padre', 'deus', 'ministerio', 'copc', 'RIT']

          canais_encontrados = []
          urls_vistas = set()

          # Contadores para limitar abertos comuns
          cont_globo = 0
          cont_sbt = 0
          cont_record = 0

          try:
              for fonte in fontes_iptv:
                  try:
                      resposta = requests.get(fonte, timeout=15)
                      if resposta.status_code == 200:
                          linhas = resposta.text.splitlines()
                          nome_atual = ''
                          for linha in linhas:
                              if linha.startswith('#EXTINF:'):
                                  if ',' in linha:
                                      nome_atual = linha.split(',')[1].strip()
                              elif linha.startswith('http'):
                                  link_canal = linha.strip()
                                  
                                  if link_canal in urls_vistas:
                                      continue

                                  nome_lower = nome_atual.lower()

                                  # Se tiver termo proibido, pula fora
                                  if any(proibido in nome_lower for proibido in termos_proibidos):
                                      continue

                                  aceitar = False

                                  # 1. Regionais do Ceará (Prioridade total)
                                  if any(ce in nome_lower for ce in ['tv diario', 'tv jangadeiro', 'tv cidade', 'tv ceara', 'diario do nordeste']):
                                      aceitar = True

                                  # 2. Filmes (Pode puxar tudo o que for de filme/24h)
                                  elif any(filme in nome_lower for filme in ['filme', 'hbo', 'telecine', 'cinemax', 'paramount', 'megapix', 'warner', 'action', 'comedy', 'classics', 'sky', 'universal', 'studio']):
                                      aceitar = True

                                  # 3. Esportes famosos
                                  elif any(esp in nome_lower for esp in ['espn', 'sportv', 'premiere', 'caze', 'combate', 'conmebol', 'bandsports', 'nfl', 'nba']):
                                      aceitar = True

                                  # 4. Desenhos e Animes
                                  elif any(desenho in nome_lower for desenho in ['cartoon', 'anime', 'crunchyroll', 'disney', 'nickelodeon', 'nick', 'toon', 'boomerang', 'kirito', 'otaku']):
                                      aceitar = True

                                  # 5. Globo (Até 4 opções)
                                  elif 'globo' in nome_lower and cont_globo < 4:
                                      cont_globo += 1
                                      aceitar = True

                                  # 6. SBT (Até 4 opções)
                                  elif 'sbt' in nome_lower and cont_sbt < 4:
                                      cont_sbt += 1
                                      aceitar = True

                                  # 7. Record (Até 4 opções)
                                  elif 'record' in nome_lower and cont_record < 4:
                                      cont_record += 1
                                      aceitar = True

                                  if aceitar:
                                      urls_vistas.add(link_canal)
                                      canais_encontrados.append({
                                          'nome': nome_atual,
                                          'url': link_canal,
                                          'categoria': 'Filtrado'
                                      })

                                  if len(canais_encontrados) >= 200:
                                      break
                  except:
                      pass
                  if len(canais_encontrados) >= 200:
                      break
              
              if canais_encontrados:
                  payload = {'canais': canais_encontrados}
                  update_resp = requests.put(url, json=payload, headers=headers)
                  if update_resp.status_code == 200:
                      print(f'Sucesso! {len(canais_encontrados)} canais limpos e selecionados salvos no JSONBin.')
                  else:
                      print(f'Erro ao atualizar JSONBin: {update_resp.text}')
              else:
                  print('Nenhum canal valido encontrado.')

          except Exception as e:
              print(f'Erro na execucao do robo: {e}')
          "
