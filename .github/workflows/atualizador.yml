name: Robô Atualizador IPTV

on:
  schedule:
    - cron: '*/10 * * * *' # Roda a cada 10 minutos
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Executar Varredura e Atualizacao Inteligente
        env:
          JSONBIN_BIN_ID: "${{ secrets.JSONBIN_BIN_ID }}"
          JSONBIN_SECRET_KEY: "${{ secrets.JSONBIN_SECRET_KEY }}"
        run: |
          python -c "
          import requests
          import os

          bin_id = os.environ.get('JSONBIN_BIN_ID')
          secret_key = os.environ.get('JSONBIN_SECRET_KEY')
          
          url = f'https://api.jsonbin.io/v3/b/{bin_id}'
          headers = {
              'X-Master-Key': secret_key,
              'Content-Type': 'application/json'
          }

          print('Iniciando varredura automatica de canais BR (Filmes, Esportes, Abertos e Ceara)...')
          
          # Aqui entram fontes de listas abertas públicas da comunidade IPTV
          fontes_iptv = [
              'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/br.m3u'
          ]

          # Canais de interesse solicitados
          termos_busca = ['ESPN', 'SPORTV', 'PREMIERE', 'CAZE', 'GLOBO', 'SBT', 'RECORD', 'CEARA', 'DIARIO', 'FILMES', 'HBO', 'TELECINE', 'CINEMA']

          canais_encontrados = []

          try:
              for fonte in fontes_iptv:
                  resposta = requests.get(fonte, timeout=15)
                  if resposta.status_code == 200:
                      linhas = resposta.text.splitlines()
                      nome_atual = ''
                      for linha in linhas:
                          if linha.startswith('#EXTINF:'):
                              if ',' in linha:
                                  nome_atual = linha.split(',')[1].strip()
                          elif linha.startswith('http'):
                              link_canal = linha.strip()
                              # Filtra apenas se corresponder aos critérios pedidos
                              if any(termo.lower() in nome_atual.lower() for termo in termos_busca):
                                  # Testa rapidamente se o link responde
                                  try:
                                      test = requests.head(link_canal, timeout=3)
                                      if test.status_code < 400:
                                          canais_encontrados.append({
                                              'nome': nome_atual,
                                              'url': link_canal,
                                              'categoria': 'Automatico'
                                          })
                                  except:
                                      pass
                              # Limita para não sobrecarregar
                              if len(canais_encontrados) >= 40:
                                  break
              
              if canais_encontrados:
                  payload = {'canais': canais_encontrados}
                  update_resp = requests.put(url, json=payload, headers=headers)
                  if update_resp.status_code == 200:
                      print('Sucesso! JSONBin atualizado com os novos links ativos.')
                  else:
                      print(f'Erro ao atualizar JSONBin: {update_resp.text}')
              else:
                  print('Nenhum canal novo valido encontrado nesta varredura.')

          except Exception as e:
              print(f'Erro na execucao do robo: {e}')
          "
